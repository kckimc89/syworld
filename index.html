<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 검색엔진 시험기 V5 · 1차/2차 검색</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box} body{margin:0;padding:18px}.wrap{max-width:900px;margin:auto}
h1{font-size:26px;margin:0 0 8px}.sub{color:#667085;line-height:1.55;margin-bottom:18px}
.panel,.result{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.04)}
.row{display:grid;grid-template-columns:1fr 180px 110px;gap:10px}
input,select,button{font:inherit;border-radius:12px;border:1px solid #cfd4dc;padding:13px}
button{background:#3056d3;color:#fff;border:0;font-weight:800;cursor:pointer}button.secondary{background:#eef2ff;color:#3047a8}
.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.examples button{font-size:14px;padding:8px 10px;background:#eef2ff;color:#3047a8}
.status{padding:12px;border-radius:12px;background:#f8fafc;color:#475467}
.title{font-size:24px;font-weight:900}.desc{font-size:17px;line-height:1.7;white-space:pre-wrap;margin:12px 0}
.meta{font-size:13px;color:#667085}.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.photo{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#eee;position:relative}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.photo span{position:absolute;left:6px;top:6px;background:#fff;padding:2px 7px;border-radius:999px;font-weight:800}
.warn{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px}
@media(max-width:700px){.row{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<h1>🪄 카드 검색엔진 시험기 V5 · 1차/2차 검색</h1>
<div class="sub">백과사전과 완전히 분리된 시험기입니다. <b>나라 조건은 사용하지 않습니다.</b><br>
먼저 <b>대표 이름 그대로 1차 검색</b>합니다. 좋은 결과가 없을 때만, 이름에서 자연스럽게 얻을 수 있는 직접 관련 대상(예: 포도나무→포도)을 <b>2차 검색</b>합니다.<br>
1차 결과가 좋으면 2차 검색은 하지 않습니다.</div>
<div class="panel">
 <div class="row">
  <input id="q" placeholder="예: 하몽 이베리코" autocomplete="off">
  <select id="kind">
   <option value="food">음식</option><option value="animal">동물</option><option value="plant">식물</option>
   <option value="place">명소/장소</option><option value="culture">문화</option><option value="person">인물</option><option value="art">예술작품</option>
  </select>
  <button onclick="go()">검색</button>
 </div>
 <div class="examples">
  <button onclick="ex('파에야','food')">파에야</button><button onclick="ex('하몽 이베리코','food')">하몽 이베리코</button>
  <button onclick="ex('추로스','food')">추로스</button><button onclick="ex('크로케타','food')">크로케타</button>
  <button onclick="ex('스페인아이벡스','animal')">스페인아이벡스</button><button onclick="ex('스페인제국수리','animal')">스페인제국수리</button>
  <button onclick="ex('올리브나무','plant')">올리브나무</button><button onclick="ex('코르크참나무','plant')">코르크참나무</button>
  <button onclick="ex('오렌지나무','plant')">오렌지나무</button><button onclick="ex('포도나무','plant')">포도나무</button><button onclick="ex('라벤더','plant')">라벤더</button>
 </div>
</div>
<div id="out"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function J(u){let c=new AbortController(),tm=setTimeout(()=>c.abort(),4500);try{let r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(tm)}}

const KIND_KO={food:'음식',animal:'동물',plant:'식물',place:'장소',culture:'문화',person:'인물',art:'예술작품'};
const ALIAS={};
function aliases(q){return [q]}

// Generic fallback derivation. It does not contain any item name.
// Korean fruit-tree style names: "○○나무" -> "○○".
// This is attempted only after the original name fails quality checks.
function fallbackTarget(q,k){
 if(k==='plant'){
   let s=q.trim();
   if(s.endsWith('나무') && s.length>2){
     let x=s.slice(0,-2).trim();
     if(x.length>=1)return {q:x, kind:'plant', relation:'나무의 직접 관련 대상'};
   }
 }
 return null;
}
const WORDS={
 food:{yes:['음식','요리','식품','햄','빵','수프','튀김','dish','food','cuisine','ham','bread','soup','croquette'],no:['스포츠','운동','선수','기술','sport','athlete','gymnastics','move']},
 animal:{yes:['동물','새','조류','포유류','독수리','수리','늑대','곰','스라소니','아이벡스','animal','bird','mammal','eagle','wolf','bear','lynx','ibex','taxon','species'],no:['제국','왕국','국가','empire','kingdom','state']},
 plant:{yes:['식물','나무','참나무','포도나무','관목','plant','tree','oak','vine','grapevine','taxon','species'],no:['소설','문학','시','원숭이','novel','literature','poem','monkey']},
 place:{yes:['건축','장소','성당','궁전','공원','박물관','산','building','place','cathedral','palace','park','museum','mountain'],no:['음식','food']},
 culture:{yes:['문화','전통','축제','춤','음악','culture','tradition','festival','dance','music'],no:['식물','동물','plant','animal']},
 person:{yes:['인물','사람','가수','선수','작가','왕','human','person','singer','athlete','writer','king'],no:['작품','영화','책','artwork','film','book']},
 art:{yes:['작품','회화','그림','미술','painting','artwork','sculpture'],no:['화가','작가','사람','painter','artist','person']}
};
function evidence(k,s){s=(s||'').toLowerCase();let w=WORDS[k],yes=0,no=0;for(let x of w.yes)if(s.includes(x))yes++;for(let x of w.no)if(s.includes(x))no++;return{yes,no}}
function norm(s){return String(s||'').toLowerCase().replace(/[《》〈〉「」『』"'’‘·.,()\[\]\s_-]/g,'')}
function nameScore(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 100;if(a.includes(b)||b.includes(a))return 65;return 0}
async function wikiSearch(lang,q){
 let u=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=15&prop=extracts|pageimages|pageprops&exintro=1&explaintext=1&piprop=thumbnail|original&pithumbsize=1200&redirects=1&format=json&origin=*`;
 try{return Object.values((await J(u)).query?.pages||{})}catch(e){return[]}
}
async function wd(ids){
 if(!ids.length)return{};
 let u='https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+encodeURIComponent([...new Set(ids)].join('|'))+'&props=labels|descriptions|claims|sitelinks&languages=ko|en&format=json&origin=*';
 try{return(await J(u)).entities||{}}catch(e){return{}}
}
function claim(e,p){return(e?.claims?.[p]||[]).map(x=>x?.mainsnak?.datavalue?.value).filter(Boolean)}
async function typeText(e){
 let ids=[...claim(e,'P31'),...claim(e,'P279')].map(x=>x?.id).filter(Boolean).slice(0,20),es=await wd(ids);
 return Object.values(es).map(x=>[x.labels?.ko?.value,x.labels?.en?.value,x.descriptions?.ko?.value,x.descriptions?.en?.value].filter(Boolean).join(' ')).join(' ');
}
async function findSubject(q,k){
 let names=aliases(q), candidates=[];
 // Fast path: at most two Wikipedia searches total.
 for(let lang of ['ko','en']){
   let searchName=lang==='ko'?names[0]:(names.find(x=>/[A-Za-z]/.test(x))||names[0]);
   let pages=await wikiSearch(lang,searchName+' '+(lang==='ko'?KIND_KO[k]:({food:'food',animal:'animal',plant:'plant',place:'place',culture:'culture',person:'person',art:'artwork'}[k])));
   for(let i=0;i<Math.min(pages.length,8);i++){
     let p=pages[i];
     let n=Math.max(...names.map(x=>nameScore(x,p.title)));
     // Exact/near name match is mandatory. Never drift to another named object.
     if(n<65)continue;
     let ev=evidence(k,(p.title||'')+' '+(p.extract||''));
     if(ev.no)continue;
     candidates.push({p,lang,score:n+ev.yes*12+(8-i)});
   }
 }
 candidates.sort((a,b)=>b.score-a.score);
 for(let c of candidates.slice(0,3)){
   let qid=c.p.pageprops?.wikibase_item;
   if(!qid)continue;
   let e=(await wd([qid]))[qid];
   if(!e)continue;
   // One cheap entity description check; no recursive P31/P279 traversal.
   let ev=evidence(k,[e.descriptions?.ko?.value,e.descriptions?.en?.value,c.p.extract].filter(Boolean).join(' '));
   if(ev.no)continue;
   return {e,p:c.p,lang:c.lang};
 }
 return null;
}
async function page(lang,title){
 if(!title)return null;
 let u=`https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=extracts|pageimages&exintro=1&explaintext=1&piprop=thumbnail|original&pithumbsize=1200&redirects=1&format=json&origin=*`;
 try{return Object.values((await J(u)).query?.pages||{})[0]}catch(e){return null}
}
function description(q,e,ko,en){
 let s=(ko?.extract||'').replace(/\[[^\]]+\]/g,' ').replace(/\s+/g,' ').trim();
 if(s.length>=50){
   let parts=s.split(/(?<=[.!?。！？])\s+/).slice(0,4);
   let out=parts.join(' ');
   return out.length>620?out.slice(0,617)+'…':out;
 }
 let d=e.descriptions?.ko?.value||'';
 if(s && d)return (s+' '+q+'은(는) '+d+'입니다.').slice(0,620);
 if(d)return `${q}은(는) ${d}입니다.`;
 return `${q}의 대상은 확인했지만 충분한 한국어 설명을 찾지 못했습니다.`;
}
function badPhoto(u,k){
 let s=decodeURIComponent(u||'').toLowerCase(),bad=['map','range','distribution','diagram','chart','logo','flag','icon','painting','drawing','herbarium','essential_oil'];
 return bad.some(x=>s.includes(x));
}
async function commons(q,k){
 let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=25&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*';
 try{return Object.values((await J(u)).query?.pages||{}).map(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url).filter(x=>x&&!badPhoto(x,k))}catch(e){return[]}
}
async function fileUrl(name){
 if(!name)return'';
 try{let j=await J('https://commons.wikimedia.org/w/api.php?action=query&titles=File:'+encodeURIComponent(name)+'&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*');let p=Object.values(j.query?.pages||{})[0];return p?.imageinfo?.[0]?.thumburl||p?.imageinfo?.[0]?.url||''}catch(e){return''}
}
async function photos(q,k,e,ko,en){
 let a=[];
 for(let u of [ko?.thumbnail?.source,ko?.original?.source,en?.thumbnail?.source,en?.original?.source].filter(Boolean))
   if(!badPhoto(u,k))a.push(u);
 let p18=claim(e,'P18')[0];
 if(p18){let u=await fileUrl(p18);if(u&&!badPhoto(u,k))a.push(u)}
 let enName=e.labels?.en?.value||aliases(q).find(x=>/[A-Za-z]/.test(x))||q;
 a.push(...await commons(enName,k));
 return [...new Set(a)].slice(0,5);
}
async function buildResult(searchQ,k,displayQ,stage){
 let s=await findSubject(searchQ,k);
 if(!s)return null;
 let e=s.e,ko=await page('ko',e.sitelinks?.kowiki?.title),en=await page('en',e.sitelinks?.enwiki?.title);
 if(!ko&&s.lang==='ko')ko=s.p;if(!en&&s.lang==='en')en=s.p;
 let chosen=e.labels?.ko?.value||e.labels?.en?.value||s.p.title||'';
 if(Math.max(...aliases(searchQ).map(x=>nameScore(x,chosen)),...aliases(searchQ).map(x=>nameScore(x,s.p.title)))<65)return null;
 let d=description(searchQ,e,ko,en),ps=await photos(searchQ,k,e,ko,en);
 // "Good result": usable explanation and at least one photo.
 let usefulDesc=d && !d.includes('충분한 한국어 설명을 찾지 못했습니다') && d.length>=25;
 if(!usefulDesc || ps.length<1)return null;
 return {s,e,ko,en,chosen,d,ps,stage,searchQ,displayQ};
}
async function go(){
 let q=$('#q').value.trim(),k=$('#kind').value;if(!q)return;
 $('#out').innerHTML='<div class="panel status">🔎 1차 검색: 「'+esc(q)+'」 그대로 찾고 있습니다…</div>';
 try{
  let r=await buildResult(q,k,q,1);
  if(!r){
    let fb=fallbackTarget(q,k);
    if(fb){
      $('#out').innerHTML='<div class="panel status">🔎 1차 검색 결과가 부족합니다. 2차 검색: 「'+esc(fb.q)+'」을 확인하고 있습니다…</div>';
      r=await buildResult(fb.q,fb.kind,q,2);
    }
  }
  if(!r){
    $('#out').innerHTML='<div class="panel warn"><b>자동 확정하지 않았습니다.</b><br>1차 검색에서 좋은 결과를 만들지 못했고, 사용할 수 있는 2차 결과도 확인하지 못했습니다. 억지로 다른 대상을 선택하지 않고 멈췄습니다.</div>';return
  }
  let im='<div class="photos">'+r.ps.map((u,i)=>`<div class="photo"><span>${i+1}</span><img src="${esc(u)}"></div>`).join('')+'</div>';
  let note=r.stage===1
    ? `<div class="meta">✓ 1차 검색 사용 · 확정 대상: ${esc(r.chosen)} · ${esc(r.e.id)}</div>`
    : `<div class="meta">↪ 2차 검색 사용 · 카드 제목은 「${esc(q)}」 유지 · 자료 대상: ${esc(r.chosen)} · ${esc(r.e.id)}</div>`;
  $('#out').innerHTML=`<div class="result"><div class="title">${esc(q)}</div>${note}<div class="desc">${esc(r.d)}</div>${im}</div>`;
 }catch(e){$('#out').innerHTML='<div class="panel warn">검색이 오래 걸리거나 연결이 원활하지 않아 중단했습니다. 다시 시도해 주세요.</div>'}
}
function ex(q,k){$('#q').value=q;$('#kind').value=k;go()}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>

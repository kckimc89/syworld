<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>요술방망이 검색 실험실 V1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#202124}
body{margin:0;background:#f6f7fb}.wrap{max-width:980px;margin:auto;padding:18px}
h1{font-size:25px;margin:5px 0}.sub{color:#667085;line-height:1.55}.panel,.result{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #00000008}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:10px 13px}
button.primary{background:#111827;color:white;border-color:#111827}.chip.active{outline:3px solid #b8d4ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eee}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;margin:2px;font-size:12px}
.ok{background:#ecfdf3}.warn{background:#fff7ed}.small{font-size:13px;color:#667085}
pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:10px;border-radius:10px;font-size:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<h1>🪄 검색 실험실 V1</h1>
<div class="sub">백과사전에 넣기 전, <b>검색 품질만</b> 시험합니다. 나라 점수는 사용하지 않습니다. 대표 이름을 중심으로 여러 검색 결과를 모으고, 명백히 다른 종류만 버린 뒤 설명과 사진을 따로 고릅니다.</div>

<div class="panel">
 <b>시험 항목</b>
 <div class="chips" id="chips"></div>
 <div style="margin-top:14px;display:flex;gap:8px">
  <input id="q" placeholder="다른 이름도 시험" style="flex:1;padding:11px;border:1px solid #d0d5dd;border-radius:12px;font:inherit">
  <select id="kind" style="padding:10px;border-radius:12px"><option value="food">음식</option><option value="animal">동물</option><option value="plant">식물</option><option value="places">명소</option><option value="singers">인물/가수</option><option value="art">예술작품</option></select>
  <button class="primary" onclick="manual()">검색</button>
 </div>
</div>
<div id="status"></div><div id="results"></div>
</div>
<script>
const TESTS=[
 ['파에야','food'],['하몽 이베리코','food'],['추로스','food'],['크로케타','food'],
 ['스페인아이벡스','animal'],['스페인제국수리','animal'],
 ['올리브나무','plant'],['코르크참나무','plant'],['오렌지나무','plant'],['포도나무','plant'],['라벤더','plant']
];
const WORDS={
 food:{yes:['음식','요리','햄','수프','빵','튀김','간식','dish','food','cuisine','ham','soup','bread','croquette','churro','paella'],no:['운동','스포츠','선수','영화','노래','회화','sport','athlete','film','song','painting']},
 plant:{yes:['식물','나무','포도','관목','초본','plant','tree','vine','grape','species','taxon','flora'],no:['회화','그림','오일','기름','향수','painting','oil','film','song']},
 animal:{yes:['동물','새','조류','포유류','독수리','늑대','곰','스라소니','animal','bird','mammal','eagle','wolf','bear','lynx','species','taxon'],no:['회화','그림','영화','노래','painting','film','song']},
 places:{yes:['건축','성당','궁전','공원','미술관','박물관','산','기념물','building','cathedral','palace','park','museum','mountain','monument'],no:['음식','food']},
 singers:{yes:['가수','음악가','사람','singer','musician','human','person'],no:['노래','앨범','song','album']},
 art:{yes:['회화','그림','작품','미술','painting','artwork','sculpture'],no:['화가','작가','사람','painter','artist','person']}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').toLowerCase().replace(/[《》〈〉「」『』"'’‘·.,()\[\]\s_-]/g,'');
function nameScore(q,...vals){let a=norm(q),best=0;for(let v of vals){let b=norm(v);if(!b)continue;if(a===b)best=Math.max(best,100);else if(a.includes(b)||b.includes(a))best=Math.max(best,70)}return best}
function typeScore(k,t){t=(t||'').toLowerCase();let w=WORDS[k]||{yes:[],no:[]},s=0;for(let x of w.yes)if(t.includes(x))s+=3;for(let x of w.no)if(t.includes(x))s-=12;return s}
async function J(u){let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}
async function wikiSearch(lang,q){
 let u=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=12&prop=extracts|pageimages|pageprops|pageterms&exintro=1&explaintext=1&piprop=thumbnail|original&pithumbsize=1000&wbptterms=description&redirects=1&format=json&origin=*`;
 try{return Object.values((await J(u)).query?.pages||{})}catch(e){return []}
}
async function wdSearch(lang,q){
 let u=`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=${lang}&uselang=${lang}&type=item&limit=15&format=json&origin=*`;
 try{return (await J(u)).search||[]}catch(e){return []}
}
async function wdGet(ids){
 if(!ids.length)return {};
 let u=`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent([...new Set(ids)].join('|'))}&props=labels|descriptions|claims|sitelinks&languages=ko|en|es|ja&format=json&origin=*`;
 try{return (await J(u)).entities||{}}catch(e){return {}}
}
const claims=(e,p)=>(e?.claims?.[p]||[]).map(x=>x?.mainsnak?.datavalue?.value).filter(Boolean);
async function typeText(e){
 let ids=[...claims(e,'P31'),...claims(e,'P279')].map(x=>x?.id).filter(Boolean).slice(0,20),es=await wdGet(ids);
 return Object.values(es).map(x=>[x.labels?.ko?.value,x.labels?.en?.value,x.descriptions?.ko?.value,x.descriptions?.en?.value].filter(Boolean).join(' ')).join(' ')
}
async function collect(q,k){
 let rows=[];
 for(const lang of ['ko','en']){
  let pages=await wikiSearch(lang,q);
  for(let i=0;i<pages.length;i++){
   let p=pages[i],short=p.terms?.description?.[0]||'', corpus=[p.title,short,p.extract].join(' ');
   let ns=nameScore(q,p.title),ts=typeScore(k,corpus);
   rows.push({source:`Wikipedia ${lang}`,title:p.title,desc:p.extract||'',short,qid:p.pageprops?.wikibase_item||'',photo:p.thumbnail?.source||p.original?.source||'',ns,ts,rank:i});
  }
 }
 let hits=[...(await wdSearch('ko',q)),...(await wdSearch('en',q))],es=await wdGet(hits.map(x=>x.id).slice(0,25));
 for(let i=0;i<hits.length;i++){
  let h=hits[i],e=es[h.id];if(!e)continue;
  let tt=await typeText(e), corpus=[h.label,h.description,e.labels?.ko?.value,e.labels?.en?.value,e.descriptions?.ko?.value,e.descriptions?.en?.value,tt].filter(Boolean).join(' ');
  rows.push({source:'Wikidata',title:e.labels?.ko?.value||h.label||e.labels?.en?.value,desc:e.descriptions?.ko?.value||h.description||'',short:h.description||'',qid:e.id,photo:'',ns:nameScore(q,h.label,e.labels?.ko?.value,e.labels?.en?.value),ts:typeScore(k,corpus),rank:i,e});
 }
 // Reject only clear mismatches. Search presence is useful weak evidence, exact/near name is strong evidence.
 rows=rows.filter(r=>r.ts>-6).map(r=>({...r,total:r.ns+r.ts+Math.max(0,12-r.rank)}));
 rows.sort((a,b)=>b.total-a.total);
 return rows;
}
function badPhoto(u,k){let s=decodeURIComponent(u||'').toLowerCase();return ['map','range','distribution','diagram','chart','logo','flag','icon','painting','illustration','drawing','herbarium','essential_oil'].some(x=>s.includes(x))||(k==='plant'&&['olive_oil','orange_oil','lavender_oil'].some(x=>s.includes(x)))}
async function commons(q,k){
 let u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q)}&gsrlimit=24&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json&origin=*`;
 try{return Object.values((await J(u)).query?.pages||{}).map(x=>({title:x.title,url:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url||''})).filter(x=>x.url&&!badPhoto(x.url,k))}catch(e){return []}
}
async function photoPool(q,k,best){
 let a=[];
 for(let r of best.slice(0,5))if(r.photo&&!badPhoto(r.photo,k))a.push({url:r.photo,why:r.source+' 대표사진'});
 let qid=best.find(x=>x.qid)?.qid;
 if(qid)a.push(...(await commons(`haswbstatement:P180=${qid}`,k)).map(x=>({url:x.url,why:'Commons depicts '+qid})));
 // Name-only media search; no country condition.
 a.push(...(await commons(q,k)).map(x=>({url:x.url,why:'Commons 이름검색'})));
 let seen=new Set();return a.filter(x=>!seen.has(x.url)&&seen.add(x.url)).slice(0,6)
}
function goodDesc(rows){
 // Prefer Korean Wikipedia rich intro. Do not force same source as photo.
 let ko=rows.find(r=>r.source==='Wikipedia ko'&&r.ts>=0&&r.desc.length>60);
 if(ko){let s=ko.desc.replace(/\s+/g,' ').trim().split(/(?<=[.!?。！？])\s+/).slice(0,5).join(' ');return {text:s.slice(0,700),why:ko.source+' · '+ko.title}}
 let wd=rows.find(r=>r.source==='Wikidata'&&r.ts>=0&&r.desc);if(wd)return {text:wd.desc,why:'Wikidata · '+wd.title};
 let en=rows.find(r=>r.source==='Wikipedia en'&&r.ts>=0&&r.desc);return {text:en?'한국어 설명 자료가 부족합니다. 영어권 자료에서는 해당 대상을 확인했습니다.':'안전하게 사용할 설명을 찾지 못했습니다.',why:en?'Wikipedia en 확인':'없음'}
}
async function run(q,k){
 document.getElementById('status').innerHTML=`<div class="panel">🔎 <b>「${esc(q)}」</b> 검색 중…<br><span class="small">① 이름으로 자료 수집 → ② 명백한 오답 제거 → ③ 설명 선택 → ④ 사진 후보 수집</span></div>`;
 document.getElementById('results').innerHTML='';
 let rows=await collect(q,k),desc=goodDesc(rows),photos=await photoPool(q,k,rows);
 document.getElementById('status').innerHTML=`<div class="panel"><span class="badge ok">후보 ${rows.length}개</span><span class="badge">사진 ${photos.length}개</span> <b>${esc(q)}</b></div>`;
 let top=rows.slice(0,8).map(r=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(r.title)}</b> <span class="badge">${esc(r.source)}</span> <span class="badge ${r.ts<0?'warn':'ok'}">종류 ${r.ts}</span><span class="badge">이름 ${r.ns}</span><div class="small">${esc((r.short||r.desc).slice(0,180))}</div></div>`).join('');
 let imgs=photos.map(x=>`<div><img class="photo" src="${esc(x.url)}"><div class="small">${esc(x.why)}</div></div>`).join('');
 document.getElementById('results').innerHTML=`<div class="result"><h3>설명 후보</h3><div class="small">${esc(desc.why)}</div><p style="line-height:1.7">${esc(desc.text)}</p></div>
 <div class="result"><h3>사진 후보</h3><div class="grid">${imgs||'<p>사진 후보 없음</p>'}</div></div>
 <div class="result"><h3>검색기가 실제로 본 상위 후보</h3>${top||'후보 없음'}</div>`;
}
function manual(){let q=document.getElementById('q').value.trim();if(q)run(q,document.getElementById('kind').value)}
document.getElementById('chips').innerHTML=TESTS.map(([n,k])=>`<button class="chip" onclick="run('${n}','${k}')">${n}</button>`).join('');
</script></body></html>
